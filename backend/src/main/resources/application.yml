spring:
  application:
    name: classic-store-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/classicstore}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: store
  flyway:
    # TODO: B-00R Re-enable Flyway once source SQL migrations are added
    enabled: false
    schemas: store
    default-schema: store
    create-schemas: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: store
        hbm2ddl:
          auto: none
  flyway:
    enabled: false
    schemas: store
    default-schema: store
    create-schemas: true
    locations: classpath:db/migration

