name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'docs/api/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint:
    name: API Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI spec
        run: |
          npx @redocly/cli lint docs/api/openapi.yaml --config docs/api/.redocly.yaml

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}

      - name: Run Maven verify
        run: |
          if [ -d "backend" ]; then
            cd backend
            ./mvnw -B verify
          else
            echo "No /backend directory found; skipping Maven verify."
          fi

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}

      - name: OWASP Dependency-Check
        run: |
          if [ -d "backend" ]; then
            cd backend
            ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9.0
          else
            echo "No /backend directory found; skipping dependency check."
          fi
